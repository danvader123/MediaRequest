<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Media Request - overlay</title>

<style>
  :root {
    --w: 440px;          /* ancho del cuadro del video */
    --vh: 390px;         /* alto del cuadro del video */
    --bar: 50px;         /* alto de la barra inferior */
    --title-h: 60px;     /* alto reservado para el título (2 líneas) */

    --paper: #F2F5F7;
    --accent: #db12e2;
    --bar-bg: transparent;

    --title-size: 19px;
    --title-color: #ffffff;
    --title-bg: transparent;
  }

  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Bahnschrift", "Segoe UI", Arial, sans-serif;
    color: var(--paper);
  }

  #card {
    width: var(--w);
    margin: 8px;
    background: transparent;
    transform: translateX(-120%);
    transition: transform .5s ease;
  }

  #card.show { transform: none; }

  /* TÍTULO (alto fijo, para que el cuadro del video no se mueva) */
  #videoTitle {
    box-sizing: border-box;
    width: 100%;
    height: var(--title-h);
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--title-bg);
    color: var(--title-color);
    font-size: var(--title-size);
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    text-shadow: 0 2px 5px rgba(0,0,0,.9);
    overflow: hidden;
  }

  #videoTitle span {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }

  /* CUADRO DEL VIDEO: queda transparente, el video está en otra fuente de OBS */
  #hole {
    width: var(--w);
    height: var(--vh);
    box-sizing: border-box;
  }

  #hole.frame {
    outline: 2px dashed rgba(255,255,255,.7);
    outline-offset: -2px;
  }

  /* BARRA INFERIOR */
  #bar {
    height: var(--bar);
    box-sizing: border-box;
    padding: 0 14px;
    background: var(--bar-bg);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  #track {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,.3);
    box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    overflow: hidden;
  }

  #fill {
    height: 100%;
    width: 0;
    background: var(--accent);
  }

  #by {
    max-width: 55%;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
  }

  #by b { color: var(--accent); font-weight: 600; }

  /* PANEL DE DIAGNÓSTICO */
  #dbg {
    display: none;
    position: fixed;
    right: 4px;
    bottom: 4px;
    z-index: 99;
    max-width: 90%;
    padding: 4px 6px;
    font: 11px/1.3 Consolas, monospace;
    color: #fff;
    background: rgba(0,0,0,.75);
    pointer-events: none;
  }
</style>
</head>

<body>

<div id="card">
  <div id="videoTitle"><span></span></div>
  <div id="hole"></div>
  <div id="bar">
    <div id="track"><div id="fill"></div></div>
    <div id="by"></div>
  </div>
</div>

<div id="dbg"></div>

<script>

  // ==========================================
  // CONFIGURACIÓN
  // ==========================================

  // Debe coincidir con el WebSocket Server de Streamer.bot
  const WS_URL = "ws://127.0.0.1:8080/";

  // "top" = título arriba del video, "bottom" = debajo
  const TITLE_POSITION = "top";

  // true = dibuja un marco punteado donde va el video (sirve para acomodar la otra fuente)
  const SHOW_FRAME = true;

  // true = muestra abajo a la derecha un panel con lo que recibe la página
  const DEBUG = true;

  // ==========================================
  // ELEMENTOS
  // ==========================================

  const card = document.getElementById("card");
  const titleBox = document.getElementById("videoTitle");
  const titleText = titleBox.querySelector("span");
  const hole = document.getElementById("hole");
  const fillEl = document.getElementById("fill");
  const byEl = document.getElementById("by");

  if (TITLE_POSITION === "bottom") hole.after(titleBox);
  if (SHOW_FRAME) hole.classList.add("frame");

  function dbg(t) {
    if (!DEBUG) return;
    const el = document.getElementById("dbg");
    el.style.display = "block";
    const line = document.createElement("div");
    line.textContent = new Date().toLocaleTimeString() + " " + t;
    el.appendChild(line);
    while (el.children.length > 8) el.removeChild(el.firstChild);
  }

  window.addEventListener("error", (e) => dbg("JS error: " + e.message));
  dbg("página cargada (" + location.protocol + ")");

  // ==========================================
  // MOSTRAR / OCULTAR
  // ==========================================

  let tick = null;
  let hideTimer = null;

  function play(m) {

    const total = ((m.seconds || 30) + (m.delay || 0)) * 1000;
    const startAt = Date.now();

    titleText.textContent = m.title || "";

    byEl.innerHTML = "Video pedido por: <b></b>";
    byEl.querySelector("b").textContent = "@" + (m.user || "alguien");

    fillEl.style.width = "0";
    card.classList.add("show");

    clearInterval(tick);
    tick = setInterval(() => {
      const pct = Math.min(100, ((Date.now() - startAt) / total) * 100);
      fillEl.style.width = pct + "%";
    }, 100);

    // Por si nunca llega el aviso de "stop"
    clearTimeout(hideTimer);
    hideTimer = setTimeout(stop, total + 3000);

  }

  function stop() {
    clearInterval(tick);
    clearTimeout(hideTimer);
    card.classList.remove("show");
    fillEl.style.width = "0";
  }

  // ==========================================
  // STREAMER.BOT
  // ==========================================

  function connect() {

    const ws = new WebSocket(WS_URL);

    ws.onopen = () => {

      dbg("WebSocket conectado");

      ws.send(JSON.stringify({
        request: "Subscribe",
        id: "mr-subscribe",
        events: { General: ["Custom"] }
      }));

    };

    ws.onerror = () => dbg("WebSocket: error al conectar");

    ws.onmessage = (e) => {

      let d;

      try { d = JSON.parse(e.data); } catch { return; }

      if (!d.event || d.event.source !== "General" || d.event.type !== "Custom") return;

      let m = d.data;

      if (typeof m === "string") {
        try { m = JSON.parse(m); } catch { return; }
      }

      if (!m) return;

      if (m.mr === "play") {
        dbg("play: " + (m.title || "(sin título)") + " | " + m.seconds + " s | @" + m.user);
        play(m);
      } else if (m.mr === "stop") {
        dbg("stop");
        stop();
      }

    };

    ws.onclose = () => {
      dbg("WebSocket cerrado, reintentando");
      setTimeout(connect, 3000);
    };

  }

  connect();

  // ==========================================
  // MODO PRUEBA: abre la página con ?test=1 al final de la dirección
  // para ver el cuadro y acomodar la fuente del video sin hacer canjes.
  // ==========================================

  if (/[?&]test/.test(location.search)) {

    dbg("modo prueba");

    const demo = () => play({
      title: "Título de ejemplo de un video bastante largo para probar dos líneas",
      user: "usuario",
      seconds: 20,
      delay: 0
    });

    demo();
    setInterval(demo, 25000);

  }

</script>

</body>
</html>
